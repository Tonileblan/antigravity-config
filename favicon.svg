<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="orbitGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="orbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Cosmic Background Circle -->
  <rect width="100" height="100" rx="24" fill="#0B0F19" />
  <rect width="98" height="98" x="1" y="1" rx="23" fill="none" stroke="url(#orbitGrad1)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Outer Orbital Ring 1 -->
  <ellipse cx="50" cy="50" rx="36" ry="14" fill="none" stroke="url(#orbitGrad1)" stroke-width="2.5" transform="rotate(-30 50 50)" stroke-dasharray="4 2" opacity="0.85" />

  <!-- Outer Orbital Ring 2 -->
  <ellipse cx="50" cy="50" rx="36" ry="14" fill="none" stroke="#06B6D4" stroke-width="2" transform="rotate(45 50 50)" opacity="0.75" />

  <!-- Quantum Particle Nodes -->
  <circle cx="22" cy="34" r="3" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="78" cy="66" r="3.5" fill="#C084FC" filter="url(#glow)" />
  <circle cx="68" cy="28" r="2.5" fill="#34D399" filter="url(#glow)" />

  <!-- Central Antigravity Core Sphere -->
  <circle cx="50" cy="50" r="16" fill="url(#orbGrad)" filter="url(#glow)" />
  <circle cx="46" cy="45" r="5" fill="#FFFFFF" opacity="0.6" />

  <!-- Stylized "T" Core Monogram -->
  <path d="M43 42 H57 M50 42 V58" stroke="#0B0F19" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
</svg>
