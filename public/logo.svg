<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="40%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="orbGradLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Icon Container -->
  <g transform="translate(10, 8)">
    <rect width="64" height="64" rx="16" fill="#0F172A" stroke="url(#logoGrad)" stroke-width="1.5" />
    
    <!-- Outer Orbital Rings -->
    <ellipse cx="32" cy="32" rx="24" ry="9" fill="none" stroke="url(#logoGrad)" stroke-width="1.8" transform="rotate(-30 32 32)" stroke-dasharray="3 2" opacity="0.9" />
    <ellipse cx="32" cy="32" rx="24" ry="9" fill="none" stroke="#06B6D4" stroke-width="1.5" transform="rotate(45 32 32)" opacity="0.75" />
    
    <!-- Central Core -->
    <circle cx="32" cy="32" r="11" fill="url(#orbGradLogo)" filter="url(#logoGlow)" />
    <circle cx="29" cy="28" r="3.5" fill="#FFFFFF" opacity="0.6" />
    
    <!-- Stylized "T" Monogram -->
    <path d="M27 26 H37 M32 26 V38" stroke="#0F172A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography: TONIGRAVITY -->
  <text x="88" y="44" font-family="'Orbitron', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="25" fill="#FFFFFF" letter-spacing="2">
    TONI<tspan fill="url(#logoGrad)">GRAVITY</tspan>
  </text>
  
  <!-- Subtitle Badge / Motto -->
  <text x="90" y="60" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#94A3B8" font-weight="600" letter-spacing="1.2">
    AI AGENT OS &amp; MASTER DIRECTIVES
  </text>

  <!-- Status Pulse Badge -->
  <g transform="translate(300, 32)">
    <rect width="48" height="18" rx="9" fill="#065F46" opacity="0.3" />
    <circle cx="10" cy="9" r="3.5" fill="#10B981" />
    <text x="18" y="12" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700" fill="#34D399">SYNC</text>
  </g>
</svg>
